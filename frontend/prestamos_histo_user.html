<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mis Préstamos - Biblioteca</title>
  <link rel="stylesheet" href="css/estilos.css">
</head>
<body>
  <nav>
    <div>
      <a href="catalogo.html">Catálogo de Libros</a>
      <a href="prestamos_histo_user.html" class="activo">Mis Préstamos</a>
    </div>
    <div>
      <span id="info-usuario"></span>
      <button onclick="cerrarSesion()" class="peligro">Cerrar Sesión</button>
    </div>
  </nav>

  <main class="contenedor">
    <section class="tarjeta">
      <h3>Mi Historial de Préstamos</h3>
      <div class="fila-filtros">
        <select id="filtro-estado-mis-prestamos">
          <option value="">Todos los estados</option>
          <option value="solicitado">Solicitado</option>
          <option value="aprobado">Aprobado</option>
          <option value="rechazado">Rechazado</option>
          <option value="devuelto">Devuelto</option>
          <option value="perdido">Perdido</option>
        </select>
        <button id="btn-filtrar-mis-prestamos">Filtrar</button>
      </div>

      <table>
        <thead>
          <tr>
            <th>ID Préstamo</th>
            <th>Libro</th>
            <th>Código Ejemplar</th>
            <th>Fecha Solicitud / Préstamo</th>
            <th>Fecha Vencimiento</th>
            <th>Estado</th>
            <th>Multa</th>
          </tr>
        </thead>
        <tbody id="tabla-mis-prestamos-body"></tbody>
      </table>
    </section>
  </main>

  <script src="js/API.js"></script>
  <script src="js/prestamos_histo_user.js"></script>
</body>
</html>
