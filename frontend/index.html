<!DOCTYPE html>
<html lang="es" data-tema="claro">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  
<title>Acceso - Mariamulata</title>

<link rel="icon" type="image/png" href="imagenes/logoMariaMulata.png">

<link rel="stylesheet" href="css/estilos.css">

</head>

<body class="pagina-login">

  <!-- Encabezado -->
  <header class="encabezado-login">

    <a href="index.html" class="logo-biblioteca" aria-label="Inicio">
      <img src="imagenes/logo60aniosUninorte.png" alt="Logo de la Biblioteca Universitaria">
    </a>

    <button type="button" id="btn-tema" class="btn-tema" aria-label="Cambiar a modo oscuro" title="Cambiar tema">
      🌙
    </button>

  </header>

  <!-- Franjas decorativas del fondo -->
  <div class="fondo-franjas" aria-hidden="true">
    <div class="franja franja-roja"></div>
    <div class="franja franja-naranja"></div>
    <div class="franja franja-amarilla"></div>
  </div>

  <!-- Contenido principal -->
  <main class="contenedor-login">

    <section class="tarjeta tarjeta-login">

      <div class="encabezado-tarjeta">

  <img
    src="imagenes/logoMariaMulata.png"
    alt=""
    class="icono-biblioteca"
    aria-hidden="true"
  >

  <h1>Bienvenid@</h1>

        <p>
          Ingresa a tu cuenta para acceder a la Biblioteca Universitaria.
        </p>
      </div>

      <!-- Inicio de sesión unificado -->
      <form id="form-login">

        <div class="campo">
          <label for="login-correo">Correo electrónico</label>

          <input type="email" id="login-correo" placeholder="ejemplo@universidad.edu.co" autocomplete="username"
            required>
        </div>

        <div class="campo">
          <label for="login-password">Contraseña</label>

          <input type="password" id="login-password" placeholder="Ingresa tu contraseña" autocomplete="current-password"
            required>
        </div>

        <button type="submit" class="btn-principal">
          Ingresar
        </button>

      </form>

      <div class="separador">
        <span>¿Eres nuevo en la biblioteca?</span>
      </div>

      <button type="button" id="btn-registrarse" class="btn-registro">
        Registrarse
      </button>

      <a href="desarrolladores.html" class="enlace-desarrolladores">
        Conoce a los desarrolladores
      </a>

    </section>

    <p class="texto-inferior">
      Biblioteca Universitaria · Tu conocimiento, nuestro espacio.
    </p>

  </main>



  <!-- Scripts -->
  <script src="js/API.js"></script>
  <script src="js/index.js"></script>


</body>

</html>
